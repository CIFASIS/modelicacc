name: C/C++ CI

on:
  push: {}
  pull_request:
    branches: [modelicacc-dev]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    env:
      SBG_INSTALL_PREFIX: ${{ github.workspace }}/sbgraph-install

    steps:
      - name: Checkout ModelicaCC
        uses: actions/checkout@v4

      - name: Checkout SBGraph
        uses: actions/checkout@v4
        with:
          repository: CIFASIS/sb-graph

          ref: iss-135-define-include-directory

          path: _deps/sb-graph

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake \
            g++ \
            make \
            doxygen \
            pkg-config \
            libboost1.83-dev \
            libboost-program-options1.83-dev \
            libginac-dev \
            rapidjson-dev

      - name: Configure SBGraph
        run: |
          cmake -S _deps/sb-graph -B _deps/sb-graph/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${SBG_INSTALL_PREFIX}" \
            -DSBG_BUILD_TESTS=OFF \
            -DSBG_BUILD_DOCS=OFF

      - name: Build and install SBGraph
        run: |
          cmake --build _deps/sb-graph/build --parallel
          cmake --install _deps/sb-graph/build

      - name: Configure ModelicaCC
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${SBG_INSTALL_PREFIX}" \
            -DMODELICACC_BUILD_TESTS=ON \
            -DMODELICACC_BUILD_BENCHMARKS=ON

      - name: Build ModelicaCC
        run: |
          cmake --build build --parallel

      - name: Run ModelicaCC tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Generate documentation
        run: |
          cmake --build build --target modelicacc_doc
